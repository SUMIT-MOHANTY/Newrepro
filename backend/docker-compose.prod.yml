# =============================================================================
# Docker Compose - Production Configuration
# Purpose: Production deployment with PostgreSQL, Nginx, SSL termination, secrets
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: todo-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - staticfiles:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - todo-prod-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ---------------------------------------------------------------------------
  # Backend API Service - Production Mode
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: todo-backend-prod
    restart: always
    
    # Read-only root filesystem for security
    read_only: true
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Capabilities drop
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Environment variables from secrets and env file
    environment:
      - DJANGO_SETTINGS_MODULE=app.core.config
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=False
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=15
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SECURE_SSL_REDIRECT=True
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
      - SECURE_HSTS_SECONDS=31536000
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=True
      - SECURE_HSTS_PRELOAD=True
      - BEHIND_PROXY=True
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONFAULTHANDLER=1
      - PYTHONHASHSEED=random
    
    # Secrets
    secrets:
      - django_secret_key
      - jwt_secret_key
      - database_url
    
    # Port mapping (internal only, accessed via Nginx)
    expose:
      - "8000"
    
    # Writable volumes for temporary files and logs
    volumes:
      - /tmp
      - app_logs:/app/logs
      - staticfiles:/app/staticfiles
    
    # Working directory
    working_dir: /app
    
    # Health check
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Networks
    networks:
      - todo-prod-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: todo-postgres-prod
    restart: always
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Environment variables
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-todoapp}
      - POSTGRES_USER=${POSTGRES_USER:-todoapp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    
    # Secrets
    secrets:
      - postgres_password
    
    # Volume for persistent data
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todoapp} -d ${POSTGRES_DB:-todoapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # Networks
    networks:
      - todo-prod-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ---------------------------------------------------------------------------
  # Redis Cache (Optional - for session storage and caching)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: todo-redis-prod
    restart: always
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Read-only filesystem
    read_only: true
    
    # Command with security hardening
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    
    # Volumes
    volumes:
      - redis_data:/data
      - /tmp
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    # Networks
    networks:
      - todo-prod-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

# -----------------------------------------------------------------------------
# Named Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  staticfiles:
    driver: local
  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/log/todo-app

# -----------------------------------------------------------------------------
# Secrets
# -----------------------------------------------------------------------------
secrets:
  django_secret_key:
    file: ./secrets/django_secret_key.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  database_url:
    file: ./secrets/database_url.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  todo-prod-network:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.21.0.0/16
