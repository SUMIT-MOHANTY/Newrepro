[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecoding-agent-runtime"
version = "0.1.0"
description = "Vibecoding Agent Runtime — AI orchestration, MCP tools, and build pipeline"
requires-python = ">=3.12"

dependencies = [
    # Anthropic SDK — the LLM provider (plug in API key when available)
    "anthropic>=0.34.0",
    # HTTP client — for posting callback events to FastAPI
    "httpx>=0.27.0",
    # YAML config parsing
    "pyyaml>=6.0.1",
    # Structured logging
    "structlog>=24.1.0",
    # HTTP requests — for GitHub API and web search
    "requests>=2.31.0",
    # Source map resolution — maps minified JS errors to original source files
    "sourcemap>=0.1.0",
    # LangGraph StateGraph engine — deterministic node execution and transition guarantees
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "mcp*", "runtime*", "infrastructure*"]

[project.scripts]
agent = "agent.main:main"
