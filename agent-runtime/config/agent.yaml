# Agent Runtime default configuration
# All values can be overridden by environment variables.

agent:
  max_step_retries: 2
  max_build_attempts: 6
  task_timeout_minutes: 30

model:
  provider: anthropic
  name: claude-sonnet-4-5
  max_tokens: 16384
  temperature: 0.2
  # api_key: injected via ANTHROPIC_API_KEY env var — never hardcoded

tools:
  tool_use_enabled: true            # Use Claude's native tool-use API
  max_tool_calls_per_session: 50    # Safety limit on total tool calls
  web_search_enabled: true          # Enable web search for mock data research
  github_mcp_enabled: false         # Enable with GITHUB_TOKEN env var

techstack:
  default: react_vite
  framework: react
  bundler: vite
  build_type: spa                   # Single-page application

workspace:
  path: /workspace         # override with WORKSPACE_PATH env var
  max_file_size_mb: 5
  max_files_in_listing: 500

build:
  max_time_seconds: 300
  max_output_bytes: 1000000
  npm_flags:
    - --prefer-offline
    - --no-audit

preview:
  nginx_port: 80
  app_port: 3000
  type: static             # static | dev_server

research:
  enabled: false           # legacy — use web_search instead

logging:
  level: info
  format: json
