# Tool availability policy — which MCP tools are enabled

modules:
  filesystem:
    enabled: true
    tools:
      - list_directory
      - read_file
      - write_file
      - create_directory
      - delete_file
      - file_exists
      - get_file_stats

  search:
    enabled: true
    tools:
      - grep_search
      - find_and_replace
      - replace_file_content
      - batch_replace_file_content

  git:
    enabled: true
    tools:
      - init
      - status
      - add_all
      - commit
      - diff
      - log

  execution:
    enabled: true
    tools:
      - run_command

  build:
    enabled: true
    tools:
      - detect_project_type
      - install_dependencies
      - run_build
      - install_and_build
      - check_syntax
      - get_build_output_path

  web_search:
    enabled: true   # controlled by WEB_SEARCH_ENABLED env var
    tools:
      - web_search
      - fetch_page_content

  github:
    enabled: false  # controlled by GITHUB_TOKEN env var
    tools:
      - list_repo_files
      - read_repo_file
      - search_repo_code

  research:
    enabled: false   # Legacy — use web_search instead
    tools:
      - fetch_docs
      - search_npm
