# Command execution policy — §8.1 / §8.3
# Controls which executables the AI may invoke and what patterns are always blocked.

allowed_commands:
  - node
  - npm
  - npx
  - yarn
  - python
  - python3
  - pip
  - pip3
  - git
  - nginx
  - sh
  - bash
  - ls
  - cat
  - mkdir
  - pwd
  - echo
  - which

denied_patterns:
  - "rm -rf /"
  - "sudo"
  - "chmod 777"
  - "curl | sh"
  - "wget | sh"
  - "| bash"
  - "| sh"
  - "> /dev"
  - "/etc/shadow"
  - "/proc/"

max_timeout_seconds: 300
max_output_bytes: 1000000
