# Network policy — §9.1
# Documents intended network restrictions (enforced at container/Docker level
# in production; research_tools.py enforces domain allowlist in code).

outbound_allowed:
  # npm registry for package installs
  - registry.npmjs.org
  - registry.yarnpkg.com
  # Documentation research (when RESEARCH_TOOLS_ENABLED=true)
  - docs.npmjs.com
  - developer.mozilla.org
  - react.dev
  - vitejs.dev
  # FastAPI control plane callback
  - "${CALLBACK_HOST}"   # injected at runtime

outbound_denied:
  - "*"   # deny all others (enforced via Docker network policy or firewall rules)

notes:
  - "The AI does not call arbitrary URLs. Only approved research domains are reachable."
  - "The control plane callback URL is the only platform endpoint the agent contacts."
  - "Docker network=none or a restricted bridge network is recommended in production."
